[workspace]
resolver = "3"
members = [
  "crates/commands",
  "crates/config",
  "crates/core",
  "crates/disaity",
  "crates/handlers",
  "crates/subscriptions",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/AhmedEhab-SG/disaity"
license = "MIT"

[workspace.dependencies]
# leaf / data
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
strum = { version = "0.28.0", features = ["derive"] }
dotenv = "0.15.0"
chrono = "0.4.45"
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
# async / net
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
  "charset",
  "http2",
  "system-proxy",
] }
scraper = "0.27.0"
gemini-rust = "2.1.0"
# discord
poise = { git = "https://github.com/serenity-rs/poise", rev = "7346bc165532c65160df62be3114d6b279d9ce48" }
# poise = "0.7.1" # TODO: restore poise v on next release
symphonia = { version = "0.5.5", features = ["all"] }
songbird = { version = "0.6.1", features = ["builtin-queue"] }
serenity = { version = "0.12.5", default-features = false, features = [
  "builder",
  "chrono",
  "client",
  "framework",
  "gateway",
  "http",
  "model",
  "standard_framework",
  "utils",
  "rustls_backend",
  "voice",
] }
# workspace
disaity-config = { path = "crates/config", version = "0.1.0" }
disaity-core = { path = "crates/core", version = "0.1.0" }
disaity-commands = { path = "crates/commands", version = "0.1.0" }
disaity-handlers = { path = "crates/handlers", version = "0.1.0" }
disaity-subscriptions = { path = "crates/subscriptions", version = "0.1.0" }

[profile.release]
lto = "thin"
