[package]
name = "disaity"
version = "0.2.0"
edition = "2024"
build = "build.rs"
repository = "https://github.com/AhmedEhab-SG/disaity"

[dependencies]
dotenv = "0.15.0"
gemini-rust = "1.7.1"
poise = "0.6.1"
rand = "0.10.1"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "chrono", "client", "framework", "gateway", "http", "model", "utils", "rustls_backend", "voice"] }
songbird = { version = "0.6.0", features = ["builtin-queue"] }
symphonia = { version = "0.5.5", features = ["all"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
strum = { version = "0.28", features = ["derive"] }
scraper = "0.26.0"

[build-dependencies]
ureq = "2.9"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
allow-dirty = ["ci"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
installers = []

[package.metadata.dist]
include = ["bin/",".env.example", "README.md"]
