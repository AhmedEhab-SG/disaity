[package]
name = "disaity"
version = "0.3.0"
edition = "2024"
build = "build.rs"
repository = "https://github.com/AhmedEhab-SG/disaity"

[dependencies]
chrono = "0.4.45"
dotenv = "0.15.0"
gemini-rust = "1.7.1"
poise = "0.6.2"
rand = "0.10.1"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
serenity = { version = "0.12.5", default-features = false, features = [
  "builder",
  "chrono",
  "client",
  "framework",
  "gateway",
  "http",
  "model",
  "standard_framework",
  "utils",
  "rustls_backend",
  "voice",
] }
songbird = { version = "0.6.0", features = ["builtin-queue"] }
strum = { version = "0.28.0", features = ["derive"] }
symphonia = { version = "0.6.0", features = ["all"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
ureq = "3.3.0"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
allow-dirty = ["ci"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
installers = []

[package.metadata.dist]
include = ["bin/", ".env.example", "README.md"]
