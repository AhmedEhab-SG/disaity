[workspace]
resolver = "3"
members = [
  "crates/bot",
  "crates/commands",
  "crates/config",
  "crates/core",
  "crates/handlers",
]

[workspace.package]
edition = "2024"
version = "0.3.6"
repository = "https://github.com/AhmedEhab-SG/disaity"

[workspace.dependencies]
# leaf / data
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
strum = { version = "0.28.0", features = ["derive"] }
dotenv = "0.15.0"
chrono = "0.4.45"
rand = "0.10.2"
tracing = "0.1.44"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
# async / net
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
scraper = "0.27.0"
gemini-rust = "2.0.0"
# discord
poise = "0.6.2"
symphonia = { version = "0.5.5", features = ["all"] }
songbird = { version = "0.6.0", features = ["builtin-queue"] }
serenity = { version = "0.12.5", default-features = false, features = [
  "builder",
  "chrono",
  "client",
  "framework",
  "gateway",
  "http",
  "model",
  "standard_framework",
  "utils",
  "rustls_backend",
  "voice",
] }
# internal crates
disaity-config = { path = "crates/config" }
disaity-core = { path = "crates/core" }
disaity-commands = { path = "crates/commands" }
disaity-handlers = { path = "crates/handlers" }


[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
allow-dirty = ["ci"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
installers = []
