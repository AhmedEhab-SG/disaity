[package]
name = "disaity"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
poise = "0.6.1"
reqwest = { version = "0.12.26", features = ["json"] }
serenity = { version = "0.12.4", default-features = false, features = ["builder", "chrono", "client", "framework", "gateway", "http", "model", "utils", "rustls_backend", "voice"] }
songbird = { version = "0.5.0", features = ["builtin-queue"] }
symphonia = { version = "0.5.5", features = ["aac", "mp3", "isomp4", "alac"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
