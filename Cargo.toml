[package]
name = "disaity"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
gemini-rust = "1.7.1"
poise = "0.6.1"
rand = "0.10.0"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "chrono", "client", "framework", "gateway", "http", "model", "utils", "rustls_backend", "voice"] }
songbird = { version = "0.5.0", features = ["builtin-queue"], git = "https://github.com/beerpsi-forks/songbird", branch = "davey" }
symphonia = { version = "0.5.5", features = ["all"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
