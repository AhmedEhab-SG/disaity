name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package everything without uploading to crates.io
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev

      - name: Verify the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "disaity") | .version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $tag does not match workspace version $manifest" >&2
            exit 1
          fi

      - name: Package
        run: cargo package --workspace --no-verify

      # Dependency order: each crate must already be on crates.io before the
      # one that depends on it. `--no-verify` avoids rebuilding against an
      # index that has not caught up yet.
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in \
            disaity-config \
            disaity-core \
            disaity-commands \
            disaity-handlers \
            disaity-subscriptions \
            disaity
          do
            echo "::group::publishing $crate"
            cargo publish -p "$crate" --no-verify
            echo "::endgroup::"
          done
